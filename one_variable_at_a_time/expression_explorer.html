<title>CHRONOS Protein Trajectories</title>
<meta name="description" content="80 CHRONOS proteins across the buckets of 13 clinical variables (ROSMAP, Diverse, Banner).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
:root {
  --bg: #F3F5F4; --surface: #FFFFFF; --ink: #17201D; --muted: #5E6B66; --faint: #8E9A95;
  --rule: #DCE2DF; --grid: #E8ECEA; --line: #7F8E88; --tmed: #0B7A5E; --sel: #B4236A; --sel-soft: #F6E3EC;
  --up: #B4461F; --down: #2C5E9E; --chip: #E9EEEC;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0F1413; --surface: #161D1B; --ink: #E3EAE7; --muted: #9DAAA5; --faint: #6F7C77;
    --rule: #2A3431; --grid: #222B28; --line: #74847E; --tmed: #3CC99F; --sel: #F07AB4; --sel-soft: #3A2030;
    --up: #F08A5D; --down: #7FA8E6; --chip: #222B28;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0F1413; --surface: #161D1B; --ink: #E3EAE7; --muted: #9DAAA5; --faint: #6F7C77;
  --rule: #2A3431; --grid: #222B28; --line: #74847E; --tmed: #3CC99F; --sel: #F07AB4; --sel-soft: #3A2030;
  --up: #F08A5D; --down: #7FA8E6; --chip: #222B28;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
.page { max-width: 1480px; margin: 0 auto; padding-inline: 20px; padding-block: 20px 40px; }
header.top { display: grid; gap: 10px; margin-bottom: 16px; }
h1 { font-family: var(--serif); font-weight: 600; font-size: 26px; line-height: 1.15; margin: 0; text-wrap: balance; }
.lede { color: var(--muted); max-width: 72ch; margin: 0; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-top: 4px; }
.search { display: flex; align-items: center; gap: 8px; }
.search input { font: inherit; font-family: var(--mono); font-size: 13px; width: 150px; padding: 6px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; background: var(--surface); }
.seg button { font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--muted); padding: 6px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.check { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; cursor: pointer; }
.btn { font: inherit; font-size: 13px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); padding: 6px 10px; border-radius: 6px; cursor: pointer; }
button:focus-visible, input:focus-visible, .row:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
.charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 12px 6px; position: relative; }
.card.focus { border-color: var(--sel); }
.card .eyebrow { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.card h2 { font-size: 15px; font-weight: 600; margin: 1px 0 0; }
.card .note { font-size: 12px; color: var(--muted); }
.card .meta { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-top: 2px; }
.card svg { width: 100%; height: auto; display: block; margin-top: 6px; }
.card .hidden-b { font-size: 11px; color: var(--faint); margin: 2px 0 4px; }
svg text { fill: var(--muted); font-family: var(--mono); font-size: 10px; }
svg .n text { fill: var(--faint); font-size: 9px; }
svg .gridl { stroke: var(--grid); stroke-width: 1; }
svg .zero { stroke: var(--faint); stroke-dasharray: 3 3; }
svg .ln { fill: none; stroke: var(--line); stroke-width: 1; opacity: .28; }
svg .ln.tm { stroke: var(--tmed); stroke-width: 1.8; opacity: .95; }
svg .ln.sl { stroke: var(--sel); stroke-width: 2.6; opacity: 1; }
svg .hit { fill: none; stroke: transparent; stroke-width: 9; cursor: pointer; }
svg .pt { fill: var(--sel); }
svg .eb { stroke: var(--sel); stroke-width: 1.2; }
svg .hov { fill: none; stroke: var(--ink); stroke-width: 1.6; opacity: .9; pointer-events: none; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-family: var(--mono); font-size: 11px; padding: 3px 7px; border-radius: 4px; white-space: nowrap; transform: translate(-50%, -130%); }

aside.panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 16px; max-height: calc(100vh - 24px); overflow: auto; }
.panel .pname { font-family: var(--mono); font-size: 22px; font-weight: 500; color: var(--sel); display: flex; align-items: baseline; gap: 10px; }
.panel .tag { font-family: var(--sans); font-size: 11px; background: var(--chip); color: var(--tmed); padding: 2px 7px; border-radius: 10px; font-weight: 600; }
.panel h3 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); font-weight: 600; margin: 16px 0 6px; }
.panel p { margin: 6px 0; color: var(--muted); }
.panel .close { float: right; display: none; }
table.bk { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
table.bk th { font-family: var(--sans); font-weight: 500; color: var(--faint); font-size: 11px; text-align: right; padding: 3px 4px; border-bottom: 1px solid var(--rule); }
table.bk th:first-child, table.bk td:first-child { text-align: left; }
table.bk td { text-align: right; padding: 3px 4px; border-bottom: 1px solid var(--grid); }
.sig { color: var(--sel); font-weight: 500; }
.rows { display: grid; gap: 2px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 96px 64px; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 5px; cursor: pointer; font-size: 12.5px; }
.row:hover { background: var(--chip); }
.row.on { background: var(--sel-soft); }
.row .v { font-family: var(--mono); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.bar { position: relative; height: 8px; background: var(--grid); border-radius: 4px; }
.bar b { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.bar::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; border-left: 1px solid var(--faint); }
.quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.quick button { font-family: var(--mono); font-size: 12px; }
.foot { color: var(--faint); font-size: 12px; margin-top: 18px; max-width: 90ch; }

@media (max-width: 960px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  aside.panel { position: fixed; left: 0; right: 0; bottom: 0; top: auto; max-height: 48vh; border-radius: 12px 12px 0 0; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -6px 24px rgba(0,0,0,.18); z-index: 5; }
  aside.panel.closed { display: none; }
  .panel .close { display: inline-block; }
  .page { padding-bottom: 50vh; }
}
@media (prefers-reduced-motion: no-preference) { .row, .card { transition: background-color .12s, border-color .12s; } }

    const cls = "ln" + (S.tmed && TMED.has(P[i]) ? " tm" : "");
    if (P[i] !== S.sel) lines += `<path class="${cls}" d="${d}"/>`;
    hits += `<path class="hit" data-p="${P[i]}" d="${d}"/>`;
  });
  s += lines;
  if (S.sel) {
    const i = IX[S.sel], arr = series(V, i);
    s += `<path class="ln sl" d="${path(arr)}"/>`;
    arr.forEach((v, j) => {
      if (v == null) return;
      if (S.mode === "lev" && V.se[i][j] != null) s += `<line class="eb" x1="${xs(j)}" x2="${xs(j)}" y1="${ys(v - V.se[i][j])}" y2="${ys(v + V.se[i][j])}"/>`;
      s += `<circle class="pt" cx="${xs(j)}" cy="${ys(v)}" r="2.8"/>`;
    });
  }
  s += `<path class="hov" d=""/>` + hits + `</svg>`;
  return { svg: s, xs, ys, path };
}

function renderCharts() {
  const host = $("charts"); host.innerHTML = "";
  D.vars.forEach(V => {
    const card = document.createElement("section");
    card.className = "card" + (V.key === S.focus ? " focus" : "");
    const r = draw(V);
    card.innerHTML = `<div class="eyebrow">${V.family}</div><h2>${V.name}</h2><div class="note">${V.note}</div>
      <div class="meta">${V.n_total} people · ${S.mode === "lev" ? "mean level (z)" : "change vs " + V.ref + " (SD), others held"}</div>
      ${r.svg}${V.hidden.length ? `<div class="hidden-b">not plotted (&lt;10 people): ${V.hidden.join(", ")}</div>` : ""}<div class="tip" hidden></div>`;
    const svg = card.querySelector("svg"), tip = card.querySelector(".tip"), hov = svg.querySelector(".hov");
    svg.addEventListener("pointermove", e => {
      const t = e.target.closest(".hit");
      if (!t) { tip.hidden = true; hov.setAttribute("d", ""); return; }
      const p = t.dataset.p, i = IX[p], pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
      const k = V.buckets.length; let j = 0, best = 1e9;
      for (let a = 0; a < k; a++) { const dx = Math.abs(r.xs(a) - loc.x); if (dx < best) { best = dx; j = a; } }
      const v = series(V, i)[j];
      hov.setAttribute("d", r.path(series(V, i)));
      const cr = card.getBoundingClientRect();
      tip.textContent = `${p} · ${V.buckets[j]}: ${fmt(v)}`; tip.hidden = false;
      tip.style.left = (e.clientX - cr.left) + "px"; tip.style.top = (e.clientY - cr.top) + "px";
    });
    svg.addEventListener("pointerleave", () => { tip.hidden = true; hov.setAttribute("d", ""); });
    svg.addEventListener("click", e => {
      const t = e.target.closest(".hit");
      S.focus = V.key;
      if (t) S.sel = t.dataset.p;
      update();
    });
    host.appendChild(card);
  });
}

function renderPanel() {
  const el = $("panel"); el.classList.remove("closed");
  if (!S.sel) {
    el.innerHTML = `<h3 style="margin-top:0">No protein selected</h3><p>Click any line in a plot, or type a protein name above.</p>
      <div class="quick">${["TMED2", "TMED9", "TMED10", "APP", "BACE1", "PSEN1"].map(p => `<button class="btn" data-q="${p}">${p}</button>`).join("")}</div>`;
    el.querySelectorAll("[data-q]").forEach(b => b.onclick = () => { S.sel = b.dataset.q; update(); });
    return;
  }
  const i = IX[S.sel], V = D.vars.find(v => v.key === S.focus) || D.vars[0];
  let h = `<button class="btn close" id="pclose">Close</button><div class="pname">${S.sel}${TMED.has(S.sel) ? '<span class="tag">TMED module</span>' : ""}</div>`;
  h += `<h3>${V.name}, bucket by bucket</h3><div style="overflow-x:auto"><table class="bk"><thead><tr><th>bucket</th><th>n</th><th>mean ± SE</th><th>held vs ${V.ref}</th><th>p</th></tr></thead><tbody>`;
  V.buckets.forEach((b, j) => {
    const m = V.mean[i][j], se = V.se[i][j], hv = V.held[i][j], hp = V.held_p[i][j];
    h += `<tr><td>${b}</td><td>${V.n[i][j]}</td><td>${fmt(m)} ± ${se == null ? "–" : se.toFixed(2)}</td><td>${hv === 0 && (b === V.ref) ? "ref" : fmt(hv)}</td><td class="${hp != null && hp < .05 ? "sig" : ""}">${fp(hp)}</td></tr>`;
  });
  h += `</tbody></table></div><p style="font-size:12px">Mean ± SE: average level (within-cohort z-score) of everyone in the bucket. Held: change from ${V.ref}, with every other clinical variable, sex, APOE, PMI and cell types held the same. p: that single step.</p>`;
  const e = V.effect[i];
  if (e) h += `<p><b>Per step, everything else held:</b> <span class="${e[2] < .05 ? "sig" : ""}">${fmt(e[0], 3)} SD</span> (p ${fp(e[1])}, FDR q ${fp(e[2])})</p>`;
  h += `<h3>All 13 variables · per step, everything else held</h3><div class="rows">`;
  const mx = Math.max(.05, ...D.vars.map(v => v.effect[i] ? Math.abs(v.effect[i][0]) : 0));
  D.vars.forEach(v => {
    const e = v.effect[i]; const b = e ? e[0] : 0, w = Math.abs(b) / mx * 50;
    const col = b >= 0 ? "var(--up)" : "var(--down)";
    h += `<div class="row${v.key === S.focus ? " on" : ""}" tabindex="0" data-v="${v.key}" title="${v.name}"><span>${v.name}</span>
      <span class="bar"><b style="left:${b >= 0 ? 50 : 50 - w}%;width:${w}%;background:${col}"></b></span>
      <span class="v ${e && e[2] < .05 ? "sig" : ""}">${e ? fmt(b) : "–"}${e && e[2] < .05 ? "*" : ""}</span></div>`;
  });
  h += `</div><p style="font-size:12px">Bar = change per bucket step (SD), red up, blue down; * = FDR q &lt; 0.05 across the 80 proteins. Click a row to show that variable's buckets above.</p>`;
  el.innerHTML = h;
  el.querySelectorAll(".row").forEach(r => { const go = () => { S.focus = r.dataset.v; update(); }; r.onclick = go; r.onkeydown = ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); go(); } }; });
  const c = $("pclose"); if (c) c.onclick = () => el.classList.add("closed");
}

function renderLegend() {
  $("legend").innerHTML = `<span><i style="border-color:var(--line);opacity:.5"></i>other proteins</span>` +
    (S.tmed ? `<span><i style="border-color:var(--tmed)"></i>TMED2 / TMED9 / TMED10</span>` : "") +
    (S.sel ? `<span><i style="border-color:var(--sel);border-top-width:3px"></i>${S.sel} (selected${S.mode === "lev" ? ", ± SE" : ""})</span>` : "");
  $("foot").textContent = S.mode === "lev"
    ? "Levels: each protein's mean level (within-cohort z-score, so 0 = that cohort's average) among the people in each bucket. Variables measured in one cohort only show that cohort. Buckets are the same as the DAG states."
    : "Everything else held: how each protein changes from the first bucket (APOE: from 33) when only this variable moves and every other clinical variable, sex, APOE, PMI and the 5 cell-type scores stay the same (per-cohort regressions, pooled). NIA-Reagan is built from Braak + CERAD, so those two are not held for it. Gaps mean a step could not be estimated.";
}

function update() {
  $("m-lev").setAttribute("aria-pressed", S.mode === "lev"); $("m-held").setAttribute("aria-pressed", S.mode === "held");
  renderLegend(); renderCharts(); renderPanel();
}
$("m-lev").onclick = () => { S.mode = "lev"; update(); };
$("m-held").onclick = () => { S.mode = "held"; update(); };
$("tm").onchange = e => { S.tmed = e.target.checked; update(); };
$("clr").onclick = () => { S.sel = null; $("q").value = ""; update(); };
$("q").addEventListener("input", e => { const v = e.target.value.trim().toUpperCase(); if (IX[v] != null) { S.sel = v; update(); } });
update();
</script>
